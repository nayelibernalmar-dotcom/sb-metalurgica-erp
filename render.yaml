services:
  - type: web
    name: sb-metalurgica-erp
    runtime: node
    plan: free
    region: oregon
    buildCommand: "cd backend && npm install && cd ../frontend && npm install && npm run build && rm -rf ../backend/public && cp -r dist ../backend/public"
    startCommand: "cd backend && npm run migrate && npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sb-metalurgica-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: sb-metalurgica-db
    plan: free
    region: oregon
